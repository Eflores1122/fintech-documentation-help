disclaimer: Reglas de apoyo documental. No constituyen asesoría legal ni fiscal.
rules:
- last_verified: '2026-11-05'
  id: sat-rmf-calendario-anual
  domain: sat
  title: Calendario de actualización ante la RMF anual
  requirement: "La Resolución Miscelánea Fiscal se publica cada año. Los procesos fiscales deben tener una persona responsable y una lista de verificación después de la publicación en el DOF, más el seguimiento de las resoluciones de modificaciones."
  check_hint: "El procedimiento fiscal debe mencionar la RMF 2026, publicada en el DOF el 28 de diciembre de 2025, y a quien da seguimiento."
  fix_suggestion: Nombre a la persona responsable y arme la lista de verificación que se corre al publicarse la RMF 2026 y cada resolución de modificaciones.
  entity_types:
  - IFPE
  - IFC
  - fintech_general
  documents:
  - calendario_cumplimiento_fiscal
  - politica_cfdi
  - manual_fiscal
  source_url: "https://www.sat.gob.mx/minisitio/NormatividadRMFyRGCE/normatividad_rmf_rgce2026.html"
  source_name: SAT Normatividad RMF 2026; RMF publicada el 28-dic-2025
  effective_date: '2026-01-01'
  severity: high
  diff_note: El calendario anual debe apuntar a la RMF 2026 (DOF 28 de diciembre de 2025) y ya no quedarse en la del ejercicio 2025.
  matcher:
    require_document: true
    checks:
    - type: contains_all_groups
      groups:
      - name: Mención de la RMF
        any:
        - RMF
        - resolución miscelánea
        - resolucion miscelanea
      - name: Calendario o lista de verificación
        any:
        - calendario
        - checklist
        - lista de verificación
        - lista de verificacion
      - name: Persona responsable
        any:
        - responsable
        - encargado
        - titular del área
        - owner
- last_verified: '2026-11-05'
  id: sat-rmf2026-publicacion
  domain: sat
  title: Referenciar la RMF 2026 vigente
  requirement: Las políticas y los manuales fiscales no deben quedar anclados solo a la RMF 2025. Deben citar o incorporar la RMF 2026 y las modificaciones publicadas.
  check_hint: Fallar si el manual solo menciona la RMF 2025 y no la de 2026.
  fix_suggestion: Actualice la cita normativa a la Resolución Miscelánea Fiscal 2026 y deje constancia de la revisión de sus modificaciones.
  entity_types:
  - IFPE
  - IFC
  - fintech_general
  documents:
  - manual_fiscal
  - politica_cfdi
  source_url: "https://dof.gob.mx/2025/SHCP/SHCP_281225_01.pdf"
  source_name: RMF 2026 DOF 28-dic-2025
  effective_date: '2026-01-01'
  severity: high
  supersedes: sat-rmf2025-publicacion
  diff_note: La RMF del ejercicio 2026 se publicó en el DOF el 28 de diciembre de 2025.
  matcher:
    require_document: true
    checks:
    - type: contains_any
      label: la RMF 2026
      any:
      - RMF 2026
      - miscelánea fiscal 2026
      - miscelanea fiscal 2026
      - resolución miscelánea fiscal para 2026
      - resolucion miscelanea fiscal para 2026
- last_verified: '2026-11-05'
  unverified: true
  id: sat-cfdi40-emision
  domain: sat
  title: Proceso documentado de emisión de CFDI 4.0
  requirement: "Contar con un procedimiento de facturación electrónica CFDI 4.0 alineado al CFF, a la RMF 2026 y al Anexo 29, incluidas las cancelaciones y las validaciones."
  check_hint: El manual debe decir versión 4.0 y el rol del proveedor de certificación. Los números de regla de la RMF 2026 no se afirman aquí.
  fix_suggestion: "Migre el procedimiento de CFDI 3.3 a CFDI 4.0 y documente timbrado, cancelación y validaciones. Confirme los números de regla contra el PDF de la RMF 2026 antes de citarlos."
  entity_types:
  - IFPE
  - IFC
  - fintech_general
  documents:
  - politica_cfdi
  - manual_fiscal
  source_url: "https://www.sat.gob.mx/minisitio/NormatividadRMFyRGCE/normatividad_rmf_rgce2026.html"
  source_name: SAT RMF 2026 / Anexo 29 (hub)
  effective_date: '2022-01-01'
  severity: high
  unverified_detail: "Los números de regla de la RMF 2026 que detallan el CFDI no se transcribieron: el PDF completo no se leyó línea por línea. La versión 4.0 sí es el estándar vigente que el procedimiento debe nombrar."
  diff_note: La cita del procedimiento pasa del hub de la RMF 2025 al hub de la RMF 2026. El detalle numérico sigue UNVERIFIED.
  matcher:
    require_document: true
    checks:
    - type: contains_any
      label: CFDI versión 4.0
      any:
      - CFDI 4.0
      - versión 4.0
      - version 4.0
      - cfdi version 4.0
- last_verified: '2026-11-05'
  unverified: true
  id: sat-complemento-pagos-rep
  domain: sat
  title: Complemento de recepción de pagos
  requirement: "Si se reciben pagos en parcialidades o diferidos, debe documentarse la emisión del complemento de recepción de pagos conforme a las reglas vigentes."
  check_hint: Aplique solo si el modelo tiene pagos parciales o diferidos. El plazo exacto de la RMF 2026 no se afirma aquí.
  fix_suggestion: "Si hay pagos parciales o diferidos, documente quién emite el complemento de recepción de pagos y en qué momento. Confirme el plazo en la regla vigente de la RMF 2026."
  entity_types:
  - IFPE
  - IFC
  - fintech_general
  documents:
  - politica_cfdi
  - manual_fiscal
  source_url: "https://www.sat.gob.mx/minisitio/NormatividadRMFyRGCE/normatividad_rmf_rgce2026.html"
  source_name: "SAT RMF 2026 (hub), complemento de pagos"
  effective_date: '2022-01-01'
  severity: medium
  applies_if: has_partial_or_deferred_payments
  unverified_detail: El plazo coloquialmente citado como quinto día del mes siguiente debe confirmarse en la regla vigente de la RMF 2026; no se copia un número de regla no leído.
  diff_note: La fuente del complemento de pagos se actualiza al hub de la RMF 2026. El plazo concreto sigue UNVERIFIED.
  matcher:
    require_document: true
    checks:
    - type: contains_any
      label: el complemento de recepción de pagos
      any:
      - complemento de pago
      - complemento de recepción de pagos
      - complemento de recepcion de pagos
      - recepción de pagos
      - recepcion de pagos
- last_verified: '2026-11-05'
  id: sat-carta-porte
  domain: sat
  title: Complemento Carta Porte si hay transporte de mercancías
  requirement: "Solo si la fintech, o un tercero cubierto por su CFDI, mueve mercancías en territorio nacional, debe emitirse el complemento Carta Porte."
  check_hint: Marcar como no aplicable si no hay logística de mercancías.
  fix_suggestion: "Si transporta mercancías, documente el complemento Carta Porte. Si no transporta, deje constancia de que el supuesto no aplica y no active esta bandera."
  entity_types:
  - fintech_general
  documents:
  - politica_cfdi
  - procedimiento_carta_porte
  source_url: "https://wwwmat.sat.gob.mx/consultas/68823/complemento-carta-porte-"
  source_name: SAT Complemento Carta Porte
  effective_date: '2021-12-01'
  severity: medium
  applies_if: transports_goods
  matcher:
    require_document: true
    checks:
    - type: contains_any
      label: el complemento Carta Porte
      any:
      - carta porte
- last_verified: '2026-11-05'
  id: sat-plataformas-tecnologicas
  domain: sat
  title: Retenciones y complemento de plataformas tecnológicas
  requirement: "Si la entidad es plataforma tecnológica en los supuestos de la LISR o de la LIVA, debe documentar el CFDI de retenciones con el complemento de servicios de plataformas tecnológicas y los enteros."
  check_hint: Solo si el modelo tributa como plataforma tecnológica.
  fix_suggestion: "Si está en el régimen de plataformas tecnológicas, documente el complemento y el entero de las retenciones. Si no lo está, no active la bandera."
  entity_types:
  - fintech_general
  - plataforma_tecnologica
  documents:
  - manual_fiscal
  - politica_retenciones
  source_url: "https://wwwmat.sat.gob.mx/consulta/52846/complemento-servicios-de-plataformas-tecnologicas"
  source_name: SAT Complemento Servicios de Plataformas Tecnológicas
  effective_date: '2019-06-01'
  severity: high
  applies_if: is_technological_platform_tax_regime
  matcher:
    require_document: true
    checks:
    - type: contains_any
      label: el complemento de plataformas tecnológicas
      any:
      - plataformas tecnológicas
      - plataformas tecnologicas
      - complemento de servicios de plataformas
- last_verified: '2026-11-05'
  id: sat-lif2026-ifc-retencion-isr-iva
  domain: sat
  title: LIF 2026 — retención de ISR e IVA sobre intereses de las IFC
  requirement: "En 2026, las instituciones de financiamiento colectivo por cuyo conducto se paguen intereses deben retener ISR (20% sobre intereses nominales a personas físicas, personas morales del régimen general y no contribuyentes; 35% a residentes en el extranjero) e IVA del 16% sobre el valor nominal de los intereses, además de declaraciones, constancias y CFDI."
  check_hint: Solo IFC. La política de retenciones 2026 debe traer las tasas y el proceso de CFDI o constancias. No se extiende a las IFPE.
  fix_suggestion: "Si es IFC, documente la retención de ISR del 20% o 35% y de IVA del 16% sobre intereses, más el CFDI o la constancia. No copie esta obligación a una IFPE sin un fundamento distinto."
  entity_types:
  - IFC
  documents:
  - manual_fiscal
  - politica_retenciones
  - politica_cfdi
  source_url: "https://www.diputados.gob.mx/LeyesBiblio/pdf/LIF_2026.pdf"
  source_name: LIF 2026 art. 25 fr. VIII (texto Diputados); ver también SIDOF 5772357
  effective_date: '2026-01-01'
  severity: critical
  notes: La LIF rige el ejercicio fiscal. Hay que volver a leer el art. 25 fracción VIII en el PDF oficial; esta ficha no sustituye esa lectura. No se afirma que la retención alcance a las IFPE.
  diff_note: Obligación nueva del ejercicio 2026 para instituciones de financiamiento colectivo. Una IFPE no entra en esta regla.
  matcher:
    require_document: true
    checks:
    - type: contains_all_groups
      groups:
      - name: Retención
        any:
        - retención
        - retencion
      - name: ISR
        any:
        - ISR
      - name: Tasa de residentes en México
        any:
        - "20%"
        - 20 por ciento
      - name: Tasa de residentes en el extranjero
        any:
        - "35%"
        - 35 por ciento
      - name: IVA
        any:
        - IVA
        - "16%"
        - 16 por ciento
      - name: CFDI o constancia
        any:
        - CFDI
        - constancia
- last_verified: '2026-11-05'
  unverified: true
  id: sat-cff-32b-informacion
  domain: sat
  title: CFF art. 32-B — información de entidades financieras
  requirement: "Si la entidad queda en los supuestos del art. 32-B del CFF, debe poder atender requerimientos del SAT sobre cuentas y operaciones e identificar cuentahabientes."
  check_hint: Procedimiento de atención a requerimientos del SAT. El encuadre exacto de cada ITF en el 32-B no está cerrado en esta ficha.
  fix_suggestion: Documente quién atiende un requerimiento del SAT y qué datos de identificación se pueden entregar. Confirme contra el CFF vigente si la entidad está en el supuesto del art. 32-B.
  entity_types:
  - IFPE
  - IFC
  documents:
  - procedimiento_requerimientos_autoridad
  - manual_fiscal
  source_url: "https://www.diputados.gob.mx/LeyesBiblio/pdf/LRITF.pdf"
  source_name: CFF art. 32-B (cruzar con el CFF vigente en Diputados); la ficha de investigación citó la LRITF solo como ancla
  effective_date: '2014-01-01'
  severity: medium
  unverified_detail: El encuadre exacto de cada ITF en el art. 32-B del CFF no se cerró contra el texto vigente del CFF. La URL de esta ficha es la que traía la semilla de investigación (compilación de la LRITF) y debe cruzarse con el PDF del CFF.
  matcher:
    require_document: true
    checks:
    - type: contains_any
      label: el artículo 32-B del CFF
      any:
      - 32-B
      - 32-b
      - artículo 32-B
      - articulo 32-B
