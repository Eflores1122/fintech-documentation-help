rules:
- id: laboral-repse
  domain: laboral
  area: laboral
  title: REPSE en servicios especializados
  requirement: Si se contratan servicios especializados u obras especializadas, el
    expediente debe mostrar el registro REPSE del contratista. Los artículos de la
    reforma de subcontratación de la LFT no se releyeron.
  check_hint: Chequeo determinístico sobre el documento clasificado. No se completa
    la laguna.
  fix_suggestion: Actualice «REPSE en servicios especializados» con fecha de aprobación,
    versión vigente y la evidencia que pide la fuente (LFT, reforma de subcontratación
    (artículos no releídos)). No deje placeholders.
  entity_types: &id001
  - IFPE
  - IFC
  documents:
  - expediente_repse
  source_url: https://www.diputados.gob.mx/LeyesBiblio/pdf/LFT.pdf
  source_name: LFT, reforma de subcontratación (artículos no releídos)
  effective_date: '2021-04-24'
  last_verified: '2026-11-06'
  severity: high
  unverified: true
  min_strictness: standard
  binding: true
  owner_role: Recursos humanos
  remediation_days: 30
  evidence_expected:
  - Documento expediente_repse aprobado y vigente.
  procedure:
  - Confirmar que la entidad y el perfil activan «REPSE en servicios especializados».
  - Localizar el documento en el inventario y su fecha de aprobación.
  - Contrastar el texto con la fuente citada, sin inferir artículos no leídos.
  - Dejar condición, causa, efecto, recomendación, responsable y plazo.
  matcher:
    require_document: true
    checks:
    - type: contains_any
      label: el REPSE
      any:
      - REPSE
  unverified_detail: No se releyeron los artículos 13 y 15 de la LFT ni el acuerdo
    del REPSE.
  applies_if: uses_specialized_services
