- id: pld-listas-referencia-internacional
  domain: pld
  area: pld
  title: Listas ONU y OFAC como referencia, no como ley mexicana
  requirement: La lista vinculante en México es la de personas bloqueadas de la SHCP.
    OFAC y las listas de la ONU pueden usarse como referencia. El documento no debe
    llamar a OFAC obligación legal mexicana. Las 40 recomendaciones del GAFI no son
    derecho interno.
  check_hint: Chequeo determinístico sobre el documento clasificado. No se completa
    la laguna.
  fix_suggestion: Actualice «Listas ONU y OFAC como referencia, no como ley mexicana»
    con fecha de aprobación, versión vigente y la evidencia que pide la fuente (GAFI/FATF
    40 recomendaciones (referencia) y lista de personas bloqueadas SHCP). No deje
    placeholders.
  entity_types:
  - IFPE
  - IFC
  - ITF
  - fintech_general
  - SOFOM_ENR
  - transmisor_dinero
  - asesor_inversion
  - modelo_novedoso
  - plataforma_tecnologica
  - servicios_digitales
  - AV_exchange_non_ef
  documents:
  - procedimiento_listas_internacionales
  source_url: https://www.fatf-gafi.org/en/publications/Fatfrecommendations/Fatf-recommendations.html
  source_name: GAFI/FATF 40 recomendaciones (referencia) y lista de personas bloqueadas
    SHCP
  effective_date: '2012-02-16'
  last_verified: '2026-11-06'
  severity: info
  unverified: false
  min_strictness: standard
  binding: false
  owner_role: Oficial de cumplimiento
  remediation_days: 90
  evidence_expected:
  - Documento procedimiento_listas_internacionales aprobado y vigente.
  procedure:
  - Confirmar que la entidad y el perfil activan «Listas ONU y OFAC como referencia,
    no como ley mexicana».
  - Localizar el documento en el inventario y su fecha de aprobación.
  - Contrastar el texto con la fuente citada, sin inferir artículos no leídos.
  - Dejar condición, causa, efecto, recomendación, responsable y plazo.
  matcher:
    require_document: true
    checks:
    - type: contains_any
      label: la naturaleza de referencia
      any:
      - buena práctica
      - buena practica
      - no es obligatorio
      - no es una obligación
    - type: forbidden_phrases
      label: presentar a OFAC como ley mexicana
      any:
      - OFAC es obligatorio en México
      - OFAC es obligatorio en Mexico
  notes: No es obligatorio en México consultar OFAC. La obligación nacional de listas
    está en la ficha de personas bloqueadas.
  frameworks:
  - FATF/GAFI 40 recomendaciones
  - OFAC (referencia)
