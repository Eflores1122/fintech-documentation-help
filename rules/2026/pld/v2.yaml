rules:
- id: pld-comite-comunicacion
  domain: pld
  area: pld
  title: Comité de comunicación y control
  requirement: El manual o el acta deben documentar un comité de comunicación y control.
    El catálogo previo lo atribuye al art. 58 de la LRITF; ese párrafo no se releyó
    el 2026-11-06.
  check_hint: Chequeo determinístico sobre el documento clasificado. No se completa
    la laguna.
  fix_suggestion: Actualice «Comité de comunicación y control» con fecha de aprobación,
    versión vigente y la evidencia que pide la fuente (LRITF art. 58 (párrafo del
    comité no releído en esta pasada)). No deje placeholders.
  entity_types: &id001
  - IFPE
  - IFC
  documents:
  - acta_comite_comunicacion
  - manual_pld_ft
  source_url: https://www.diputados.gob.mx/LeyesBiblio/pdf/LRITF.pdf
  source_name: LRITF art. 58 (párrafo del comité no releído en esta pasada)
  effective_date: '2018-09-10'
  last_verified: '2026-11-06'
  severity: high
  unverified: true
  min_strictness: standard
  binding: true
  owner_role: Oficial de cumplimiento
  remediation_days: 30
  evidence_expected:
  - Documento acta_comite_comunicacion aprobado y vigente.
  - Documento manual_pld_ft aprobado y vigente.
  procedure:
  - Confirmar que la entidad y el perfil activan «Comité de comunicación y control».
  - Localizar el documento en el inventario y su fecha de aprobación.
  - Contrastar el texto con la fuente citada, sin inferir artículos no leídos.
  - Dejar condición, causa, efecto, recomendación, responsable y plazo.
  matcher:
    require_document: true
    checks:
    - type: contains_any
      label: el comité
      any:
      - comité de comunicación y control
      - comite de comunicacion y control
  unverified_detail: La ficha hermana del manual ya habla del art. 58. Este número
    no se releyó hoy.
