  documents:
  - estados_financieros
  source_url: https://dof.gob.mx/2025/SHCP/SHCP_090925.pdf
  source_name: Resolución CNBV DOF 9-sep-2025 y LRITF (artículo del dictamen no releído)
  effective_date: '2018-09-10'
  last_verified: '2026-11-06'
  severity: high
  unverified: true
  min_strictness: standard
  binding: true
  owner_role: Dirección de finanzas
  remediation_days: 30
  evidence_expected:
  - Documento estados_financieros aprobado y vigente.
  procedure:
  - Confirmar que la entidad y el perfil activan «Estados financieros básicos».
  - Localizar el documento en el inventario y su fecha de aprobación.
  - Contrastar el texto con la fuente citada, sin inferir artículos no leídos.
  - Dejar condición, causa, efecto, recomendación, responsable y plazo.
  matcher:
    require_document: true
    checks:
    - type: contains_any
      label: los estados financieros
      any:
      - estado de situación financiera
      - estado de resultado
  unverified_detail: Se vio que las DCG regulan estados financieros. No se releyó
    el artículo de la LRITF que la investigación previa numera como 49.
