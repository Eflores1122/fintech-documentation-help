rules:
- id: financiero-criterios-nif-2026
  domain: financiero
  area: financiero
  title: Criterios contables CNBV alineados a NIF desde 2026
  requirement: La misma resolución sustituye los criterios de contabilidad de IFC
    e IFPE para converger con las NIF y entra en vigor el 1 de enero de 2026. Los
    cambios contables se reconocen conforme a la NIF B-1, según el transitorio. La
    política contable del ejercicio 2026 debe citar esa resolución y las NIF, y no
    anclarse solo a criterios de 2018.
  check_hint: Chequeo determinístico sobre el documento clasificado. No se completa
    la laguna.
  fix_suggestion: Actualice «Criterios contables CNBV alineados a NIF desde 2026»
    con fecha de aprobación, versión vigente y la evidencia que pide la fuente (Resolución
    CNBV, DOF 9-sep-2025 (anexos 6 y 7; transitorio único)). No deje placeholders.
  entity_types: &id001
  - IFPE
  - IFC
  documents:
  - politica_contable
  source_url: https://dof.gob.mx/2025/SHCP/SHCP_090925.pdf
  source_name: Resolución CNBV, DOF 9-sep-2025 (anexos 6 y 7; transitorio único)
  effective_date: '2026-01-01'
  last_verified: '2026-11-06'
  severity: critical
  unverified: false
  min_strictness: standard
  binding: true
  owner_role: Dirección de finanzas
  remediation_days: 15
  evidence_expected:
  - Documento politica_contable aprobado y vigente.
  procedure:
  - Confirmar que la entidad y el perfil activan «Criterios contables CNBV alineados
    a NIF desde 2026».
  - Localizar el documento en el inventario y su fecha de aprobación.
  - Contrastar el texto con la fuente citada, sin inferir artículos no leídos.
  - Dejar condición, causa, efecto, recomendación, responsable y plazo.
  matcher:
    require_document: true
    checks:
    - type: contains_any
      label: las NIF
      any:
      - NIF
    - type: contains_any
      label: la resolución
      any:
      - 9 de septiembre de 2025
      - 1 de enero de 2026
    - type: forbidden_phrases
      label: anclarse solo a criterios anteriores
      any:
      - criterios contables 2018
      - únicamente los criterios de 2018
  diff_note: Obligación de catálogo 2026 por el transitorio único (vigencia 1 de enero
    de 2026).
- id: financiero-estados-financieros
