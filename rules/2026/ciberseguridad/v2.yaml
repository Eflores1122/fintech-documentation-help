- id: ciber-marco-cid-ifc
  domain: ciberseguridad
  area: ciberseguridad
  title: Controles de confidencialidad, integridad y disponibilidad (IFC)
  requirement: El art. 63 de la resolución que modifica las DCG hace responsable al
    director general o al administrador único de la IFC de implementar controles de
    seguridad de la información que procuren confidencialidad, integridad y disponibilidad,
    también si la infraestructura la da un tercero.
  check_hint: Chequeo determinístico sobre el documento clasificado. No se completa
    la laguna.
  fix_suggestion: Actualice «Controles de confidencialidad, integridad y disponibilidad
    (IFC)» con fecha de aprobación, versión vigente y la evidencia que pide la fuente
    (DCG ITF art. 63, nota DOF 5555030 (firmada 14-mar-2019)). No deje placeholders.
  entity_types:
  - IFC
  documents:
  - politica_seguridad_informacion
  source_url: https://dof.gob.mx/nota_detalle_popup.php?codigo=5555030
  source_name: DCG ITF art. 63, nota DOF 5555030 (firmada 14-mar-2019)
  effective_date: '2019-03-14'
  last_verified: '2026-11-06'
  severity: critical
  unverified: false
  min_strictness: standard
  binding: true
  owner_role: Oficial de seguridad de la información
  remediation_days: 15
  evidence_expected:
  - Documento politica_seguridad_informacion aprobado y vigente.
  procedure:
  - Confirmar que la entidad y el perfil activan «Controles de confidencialidad, integridad
    y disponibilidad (IFC)».
  - Localizar el documento en el inventario y su fecha de aprobación.
  - Contrastar el texto con la fuente citada, sin inferir artículos no leídos.
  - Dejar condición, causa, efecto, recomendación, responsable y plazo.
  matcher:
    require_document: true
    checks:
    - type: contains_any
      label: la confidencialidad
      any:
      - confidencialidad
    - type: contains_any
      label: la integridad
      any:
      - integridad
    - type: contains_any
      label: la disponibilidad
      any:
      - disponibilidad
