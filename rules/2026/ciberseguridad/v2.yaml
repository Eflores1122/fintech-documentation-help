- id: ciber-incidentes-art67-ifc
  domain: ciberseguridad
  area: ciberseguridad
  title: Notificación de incidentes a la CNBV (IFC, art. 67)
  requirement: El art. 67 ordena avisar de forma inmediata a Ciberseguridad-CNBV@cnbv.gob.mx,
    enviar la información de los anexos 11 y 12 dentro de los cinco días hábiles,
    un plan de trabajo a más tardar a los quince días hábiles de concluido el incidente,
    y avisar al cliente dentro de las cuarenta y ocho horas si hay información sensible
    comprometida. No se encontró en ese artículo un plazo de 72 horas.
  check_hint: Chequeo determinístico sobre el documento clasificado. No se completa
    la laguna.
  fix_suggestion: Actualice «Notificación de incidentes a la CNBV (IFC, art. 67)»
    con fecha de aprobación, versión vigente y la evidencia que pide la fuente (DCG
    ITF art. 67, nota DOF 5555030). No deje placeholders.
  entity_types:
  - IFC
  documents:
  - plan_respuesta_incidentes
  source_url: https://dof.gob.mx/nota_detalle_popup.php?codigo=5555030
  source_name: DCG ITF art. 67, nota DOF 5555030
  effective_date: '2019-03-14'
  last_verified: '2026-11-06'
  severity: critical
  unverified: false
  min_strictness: standard
  binding: true
  owner_role: Oficial de seguridad de la información
  remediation_days: 15
  evidence_expected:
  - Documento plan_respuesta_incidentes aprobado y vigente.
  procedure:
  - Confirmar que la entidad y el perfil activan «Notificación de incidentes a la
    CNBV (IFC, art. 67)».
  - Localizar el documento en el inventario y su fecha de aprobación.
  - Contrastar el texto con la fuente citada, sin inferir artículos no leídos.
  - Dejar condición, causa, efecto, recomendación, responsable y plazo.
  matcher:
    require_document: true
    checks:
    - type: contains_any
      label: el aviso inmediato
      any:
      - de forma inmediata
      - Ciberseguridad-CNBV@cnbv.gob.mx
    - type: contains_any
      label: los cinco días hábiles
      any:
      - cinco días hábiles
      - 5 días hábiles
    - type: contains_any
      label: los quince días hábiles
      any:
      - quince días hábiles
      - 15 días hábiles
    - type: contains_any
      label: las cuarenta y ocho horas al cliente
      any:
      - cuarenta y ocho horas
      - 48 horas
    - type: forbidden_phrases
      label: un plazo de 72 horas presentado como el de la CNBV
      any:
      - 72 horas para notificar a la CNBV
  notes: El texto leído dice aviso inmediato, cinco días hábiles, quince días hábiles
    y 48 horas al cliente. No dice 72 horas.
- id: ciber-incidentes-ifpe
  domain: ciberseguridad
  area: ciberseguridad
  title: Notificación de incidentes de la IFPE
  requirement: La IFPE debe tener un plan de notificación de incidentes a la autoridad.
    El art. 67 leído está dirigido a instituciones de financiamiento colectivo. No
    se afirma que el mismo calendario aplique a la IFPE y no se adopta un plazo de
    72 horas, porque no está en el texto consultado.
