- id: operacion-cambios
  domain: operacion
  area: operacion
  title: Gestión de cambios
  requirement: Los cambios a producción deben quedar en un procedimiento con aprobación.
    No se aisló el artículo.
  check_hint: Chequeo determinístico sobre el documento clasificado. No se completa
    la laguna.
  fix_suggestion: Actualice «Gestión de cambios» con fecha de aprobación, versión
    vigente y la evidencia que pide la fuente (DCG ITF (gestión de cambios; artículo
    no aislado)). No deje placeholders.
  entity_types: &id001
  - IFPE
  - IFC
  documents:
  - procedimiento_cambios
  source_url: https://dof.gob.mx/nota_detalle_popup.php?codigo=5555030
  source_name: DCG ITF (gestión de cambios; artículo no aislado)
  effective_date: '2019-03-14'
  last_verified: '2026-11-06'
  severity: medium
  unverified: true
  min_strictness: standard
  binding: true
  owner_role: Dirección de operaciones
  remediation_days: 45
  evidence_expected:
  - Documento procedimiento_cambios aprobado y vigente.
  procedure:
  - Confirmar que la entidad y el perfil activan «Gestión de cambios».
  - Localizar el documento en el inventario y su fecha de aprobación.
  - Contrastar el texto con la fuente citada, sin inferir artículos no leídos.
  - Dejar condición, causa, efecto, recomendación, responsable y plazo.
  matcher:
    require_document: true
    checks:
    - type: contains_any
      label: el cambio
      any:
      - gestión de cambios
      - gestion de cambios
  unverified_detail: No se leyó el artículo completo en la pasada del 2026-11-06;
    no se afirma el número como verificado.
