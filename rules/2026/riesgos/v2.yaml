rules:
- id: riesgos-matriz
  domain: riesgos
  area: riesgos
  title: Matriz de riesgos
  requirement: Debe existir una matriz con riesgo, causa, control, responsable y riesgo
    residual. El formato no está copiado de un anexo.
  check_hint: Chequeo determinístico sobre el documento clasificado. No se completa
    la laguna.
  fix_suggestion: Actualice «Matriz de riesgos» con fecha de aprobación, versión vigente
    y la evidencia que pide la fuente (LRITF art. 48 (formato de matriz no leído)).
    No deje placeholders.
  entity_types: &id001
  - IFPE
  - IFC
  documents:
  - matriz_riesgos
  source_url: https://www.diputados.gob.mx/LeyesBiblio/pdf/LRITF.pdf
  source_name: LRITF art. 48 (formato de matriz no leído)
  effective_date: '2018-03-09'
  last_verified: '2026-11-06'
  severity: high
  unverified: true
  min_strictness: standard
  binding: true
  owner_role: Dirección de riesgos
  remediation_days: 30
  evidence_expected:
  - Documento matriz_riesgos aprobado y vigente.
  procedure:
  - Confirmar que la entidad y el perfil activan «Matriz de riesgos».
  - Localizar el documento en el inventario y su fecha de aprobación.
  - Contrastar el texto con la fuente citada, sin inferir artículos no leídos.
  - Dejar condición, causa, efecto, recomendación, responsable y plazo.
  matcher:
    require_document: true
    checks:
    - type: contains_any
      label: la matriz
      any:
      - matriz de riesgos
    - type: contains_any
      label: el responsable del riesgo
      any:
      - responsable
      - riesgo residual
  unverified_detail: No se leyó el artículo completo en la pasada del 2026-11-06;
    no se afirma el número como verificado.
