- last_verified: '2026-11-05'
  id: pld-oficial-cumplimiento-certificado
  domain: pld
  title: Oficial de cumplimiento y comité de comunicación y control
  requirement: Debe existir un comité de comunicación y control y un oficial de cumplimiento. El oficial y quien haga la revisión anual deben obtener la certificación del art. 4 fr. X de la Ley de la CNBV.
  check_hint: Nombramiento y evidencia de certificación CNBV. Un puesto vacante o sin certificación no cumple.
  fix_suggestion: "Designe al oficial de cumplimiento y al comité, y conserve la constancia de certificación CNBV del oficial y del revisor anual. Un puesto vacante no sustituye el nombramiento."
  entity_types:
  - IFPE
  - IFC
  documents:
  - manual_pld_ft
  - nombramiento_oficial_cumplimiento
  - organigrama
  source_url: "https://www.diputados.gob.mx/LeyesBiblio/pdf/LRITF.pdf"
  source_name: LRITF art. 58
  effective_date: '2018-09-10'
  severity: critical
  matcher:
    require_document: true
    checks:
    - type: contains_all_groups
      groups:
      - name: Oficial de cumplimiento
        any:
        - oficial de cumplimiento
      - name: Comité de comunicación y control
        any:
        - comité de comunicación y control
        - comite de comunicacion y control
      - name: Certificación
        any:
        - certificación CNBV
        - certificacion CNBV
        - certificado por la CNBV
        - certificación prevista
    - type: forbidden_phrases
      label: un oficial vacante o sin certificación
      any:
      - vacante
      - no cuenta con certificación
      - no cuenta con certificacion
      - sin certificación
      - sin certificacion
      - no certificado
      - no certificada
- last_verified: '2026-11-05'
  id: pld-auditoria-anual
  domain: pld
  title: Revisión anual de la efectividad PLD/FT
  requirement: "Revisión anual, por auditoría interna o por un tercero independiente, de la efectividad del cumplimiento de las DCG del art. 58."
  check_hint: Debe existir el informe de auditoría PLD del año en curso o del inmediato anterior. Una mención dentro del manual no sustituye el informe.
  fix_suggestion: "Encargue y archive el informe anual de efectividad PLD/FT, emitido por auditoría interna o por un tercero independiente certificado."
  entity_types:
  - IFPE
  - IFC
  documents:
  - informe_auditoria_pld
  source_url: "https://www.diputados.gob.mx/LeyesBiblio/pdf/LRITF.pdf"
  source_name: LRITF art. 58; lineamientos CNBV 18-oct-2021 (índice Normatividad Fintech)
  effective_date: '2018-09-10'
  severity: high
  matcher:
    require_document: true
    checks:
    - type: contains_any
      label: el informe de auditoría
      any:
      - informe de auditoría
      - informe de auditoria
      - revisión anual
      - revision anual
