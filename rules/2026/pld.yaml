  id: pld-retencion-10-anos
  domain: pld
  title: Conservación de expedientes KYC y reportes PLD por al menos 10 años
  requirement: Conservar al menos diez años la información y documentación de identificación de clientes y de los actos u operaciones reportados.
  check_hint: La política de retención PLD debe decir al menos 10 años.
  fix_suggestion: Corrija el plazo de conservación de expedientes de identificación y de reportes PLD a un mínimo de diez años.
  entity_types:
  - IFPE
  - IFC
  documents:
  - manual_pld_ft
