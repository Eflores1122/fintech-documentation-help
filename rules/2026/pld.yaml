  id: pld-lista-bloqueados
  domain: pld
  title: Suspensión inmediata por lista de personas bloqueadas
  requirement: "Suspender de forma inmediata los actos, operaciones o servicios con clientes que figuren en la lista de personas bloqueadas que informe la Secretaría."
  check_hint: El procedimiento de screening y de suspensión debe estar documentado.
  fix_suggestion: Documente la consulta de la lista de personas bloqueadas y la suspensión inmediata de operaciones cuando haya coincidencia.
  entity_types:
