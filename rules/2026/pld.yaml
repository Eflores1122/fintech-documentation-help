- last_verified: '2026-11-05'
  id: lfpiorpi-2025-manual-rba-av
  domain: pld
  title: "Reforma LFPIORPI 2025 — beneficiario controlador, UMA y manual"
  requirement: "La reforma publicada el 16 de julio de 2025 redefine al beneficiario controlador, sustituye umbrales por UMA, exige identificación directa, manual de políticas, enfoque basado en riesgos, monitoreo automatizado, capacitación y auditoría, y conserva la información diez años. Es relevante para quien intercambie activos virtuales fuera de una entidad financiera y como contexto de las entidades del art. 58 de la LRITF."
  check_hint: "Verificar beneficiario controlador, UMA y el manual actualizado después de la reforma. Las fracciones VII a XI del art. 18 entran según reglas secundarias."
  fix_suggestion: "Actualice el manual con la reforma del 16 de julio de 2025: beneficiario controlador, umbrales en UMA, monitoreo automatizado y el régimen de actividades vulnerables si la entidad o una filial entra en ese supuesto."
  entity_types:
  - IFPE
  - IFC
  - AV_exchange_non_ef
  documents:
  - manual_pld_ft
  - politica_beneficiario_controlador
  - matriz_riesgos_pld
  source_url: "https://www.diputados.gob.mx/LeyesBiblio/ref/lfpiorpi/LFPIORPI_ref03_16jul25.pdf"
  source_name: LFPIORPI reforma DOF 16-jul-2025
  effective_date: '2025-07-17'
  severity: high
  notes: Las fracciones VII a XI del art. 18 entran según las reglas secundarias (transitorio tercero). No se adelantan aquí plazos que el decreto condiciona.
  matcher:
    require_document: true
    checks:
    - type: contains_all_groups
      groups:
      - name: Beneficiario controlador
        any:
        - beneficiario controlador
      - name: Reforma o actividades vulnerables
        any:
        - LFPIORPI
        - actividades vulnerables
      - name: UMA o monitoreo automatizado
        any:
        - UMA
        - monitoreo automatizado
