rules:
- last_verified: '2026-11-05'
  id: pld-manual-art58
  domain: pld
  title: Manual de medidas y procedimientos PLD/FT (art. 58)
  requirement: Las medidas y procedimientos para prevenir y detectar actos de los arts. 139 Quáter o 400 Bis del Código Penal Federal deben constar en un documento presentado a la CNBV conforme a las DCG del art. 58.
  check_hint: "El manual PLD/FT debe tener fecha, versión, alcance y el fundamento del art. 58, y no permanecer como borrador no presentado."
  fix_suggestion: "Cierre una versión del manual PLD/FT con fundamento en el art. 58 de la LRITF y regístrela como presentada a la CNBV, con fecha y alcance de productos."
  entity_types:
  - IFPE
  - IFC
  documents:
  - manual_pld_ft
  source_url: "https://www.diputados.gob.mx/LeyesBiblio/pdf/LRITF.pdf"
  source_name: LRITF art. 58-I; DCG SIDOF 5537449
  effective_date: '2018-09-10'
  severity: critical
  matcher:
    require_document: true
    checks:
    - type: contains_any
      label: el alcance PLD/FT
      any:
      - PLD
      - lavado de dinero
      - financiamiento al terrorismo
    - type: contains_any
      label: el fundamento del artículo 58
      any:
      - artículo 58
      - articulo 58
      - art. 58
    - type: forbidden_phrases
      label: un manual no presentado a la autoridad
      any:
      - no ha sido presentado
      - pendiente de presentar
- last_verified: '2026-11-05'
  id: pld-metodologia-riesgos
  domain: pld
  title: Metodología de evaluación de riesgos PLD/FT
  requirement: "Diseñar e implementar una metodología de evaluación de riesgos por productos, servicios, prácticas o tecnologías, con resultados a disposición de la Secretaría y de la CNBV."
  check_hint: Puede ser un documento propio o una sección del manual. Debe describir la metodología o el enfoque basado en riesgos.
  fix_suggestion: "Documente la metodología de evaluación de riesgos (enfoque basado en riesgos) por producto, cliente, zona y canal, y conserve los resultados."
  entity_types:
  - IFPE
  - IFC
  documents:
  - metodologia_riesgos_pld
  - matriz_riesgos_pld
  - manual_pld_ft
  source_url: "https://www.diputados.gob.mx/LeyesBiblio/pdf/LRITF.pdf"
  source_name: LRITF art. 58-I
  effective_date: '2018-09-10'
  severity: critical
  matcher:
    require_document: true
    checks:
    - type: contains_any
      label: la metodología de riesgos PLD/FT
      any:
      - enfoque basado en riesgos
      - enfoque basado en riesgo
      - metodología de riesgos
      - metodologia de riesgos
      - evaluación de riesgos
      - evaluacion de riesgos
      - metodología de evaluación
- last_verified: '2026-11-05'
  id: pld-reportes-roi-ror-rop
  domain: pld
  title: "Reportes de operaciones relevantes, inusuales e internas preocupantes"
  requirement: "Presentar a la Secretaría, por conducto de la CNBV, reportes que cubran al menos operaciones relevantes, internas preocupantes e inusuales, además de transferencias internacionales y efectivo en moneda extranjera, conforme a las DCG."
  check_hint: El procedimiento debe nombrar las tres categorías.
  fix_suggestion: "Describa la dictaminación y el envío, vía CNBV, de operaciones relevantes, inusuales e internas preocupantes, con los plazos de cada una."
  entity_types:
  - IFPE
  - IFC
  documents:
  - manual_pld_ft
  - procedimiento_reportes_uif
  source_url: "https://www.diputados.gob.mx/LeyesBiblio/pdf/LRITF.pdf"
  source_name: LRITF art. 58-II
  effective_date: '2018-09-10'
  severity: critical
  matcher:
    require_document: true
    checks:
    - type: contains_all_groups
      groups:
      - name: Operaciones relevantes
        any:
        - operaciones relevantes
        - reportes relevantes
        - reporte relevante
      - name: Operaciones inusuales
        any:
        - operaciones inusuales
        - reporte inusual
        - operación inusual
        - operacion inusual
      - name: Operaciones internas preocupantes
        any:
        - preocupantes
        - internas preocupantes
- last_verified: '2026-11-05'
  id: pld-kyc-identificacion
  domain: pld
  title: Conocimiento e identificación de clientes
  requirement: "Definir criterios de conocimiento del cliente (antecedentes, actividad, zonas) y la información y documentación que acredite la identidad, con resguardo seguro."
  check_hint: El manual de KYC o de alta debe traer tipología de clientes y documentos requeridos.
  fix_suggestion: "Documente, por tipo de cliente, la identificación exigida, la actividad y la zona, y el resguardo del expediente."
