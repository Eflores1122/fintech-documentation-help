catalog_year: 2025
last_verified: '2026-11-06'
disclaimer: Reglas de apoyo documental. No constituyen asesoría legal ni fiscal.
rules:
- id: fiscal-diot
  domain: sat
  area: fiscal
  title: DIOT
  requirement: Quien esté obligado debe documentar la Declaración Informativa de Operaciones
    con Terceros. El número de regla de la RMF 2026 no se extrajo del PDF.
  check_hint: Chequeo determinístico sobre el documento clasificado. No se completa
    la laguna.
  fix_suggestion: Actualice «DIOT» con fecha de aprobación, versión vigente y la evidencia
    que pide la fuente (RMF 2026 (hub SAT); número de regla de la DIOT no leído).
    No deje placeholders.
  entity_types: &id001
  - IFPE
  - IFC
  documents:
  - politica_diot
  source_url: https://www.sat.gob.mx/minisitio/NormatividadRMFyRGCE/normatividad_rmf_rgce2026.html
  source_name: RMF 2026 (hub SAT); número de regla de la DIOT no leído
  effective_date: '2026-01-01'
  last_verified: '2026-11-06'
  severity: medium
  unverified: true
  min_strictness: standard
  binding: true
  owner_role: Área fiscal
  remediation_days: 45
  evidence_expected:
  - Documento politica_diot aprobado y vigente.
  procedure:
  - Confirmar que la entidad y el perfil activan «DIOT».
  - Localizar el documento en el inventario y su fecha de aprobación.
  - Contrastar el texto con la fuente citada, sin inferir artículos no leídos.
  - Dejar condición, causa, efecto, recomendación, responsable y plazo.
  matcher:
    require_document: true
    checks:
    - type: contains_any
      label: la DIOT
      any:
      - DIOT
  unverified_detail: No se leyó la regla de la RMF 2026 que detalla la DIOT.
