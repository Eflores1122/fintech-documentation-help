- id: regulatorio-efectivo-ifpe
  domain: regulatorio
  area: regulatorio
  title: Límites de efectivo de la IFPE
  requirement: El art. 9 de las DCG sujeta la recepción de efectivo a autorización
    y a montos que no excedan de 10,000 UDI mensuales por cliente, y la entrega de
    efectivo a 1,500 UDI diarias por cliente, además de los niveles de cuenta de Banxico.
