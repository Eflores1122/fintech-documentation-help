- id: regulatorio-reportes-ifpe
  domain: regulatorio
  area: regulatorio
  title: Reportes regulatorios mensuales de la IFPE
  requirement: El art. 100 identifica la serie R01 catálogo mínimo A-0111, y el art.
    101 fracción I pide esa serie, junto con otras, dentro del mes inmediato siguiente
    al cierre. El calendario debe nombrar el reporte y el medio SITI.
  check_hint: Chequeo determinístico sobre el documento clasificado. No se completa
    la laguna.
  fix_suggestion: Actualice «Reportes regulatorios mensuales de la IFPE» con fecha
    de aprobación, versión vigente y la evidencia que pide la fuente (DCG ITF arts.
    100 y 101, nota DOF 5555030). No deje placeholders.
  entity_types:
  - IFPE
  documents:
  - calendario_reportes_regulatorios
  source_url: https://dof.gob.mx/nota_detalle_popup.php?codigo=5555030
  source_name: DCG ITF arts. 100 y 101, nota DOF 5555030
  effective_date: '2020-01-01'
  last_verified: '2026-11-06'
  severity: high
  unverified: false
  min_strictness: standard
  binding: true
  owner_role: Dirección de cumplimiento regulatorio
  remediation_days: 30
  evidence_expected:
  - Documento calendario_reportes_regulatorios aprobado y vigente.
  procedure:
  - Confirmar que la entidad y el perfil activan «Reportes regulatorios mensuales
    de la IFPE».
  - Localizar el documento en el inventario y su fecha de aprobación.
  - Contrastar el texto con la fuente citada, sin inferir artículos no leídos.
  - Dejar condición, causa, efecto, recomendación, responsable y plazo.
  matcher:
    require_document: true
    checks:
    - type: contains_any
      label: el catálogo mínimo de IFPE
      any:
      - A-0111
      - serie R01
      - R01
    - type: contains_any
      label: el SITI
      any:
      - SITI
  notes: El plazo legal es «dentro del mes inmediato siguiente», no un día fijo del
    mes.
