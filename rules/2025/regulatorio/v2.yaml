rules:
- id: regulatorio-capital-minimo-udi
  domain: regulatorio
  area: regulatorio
  title: Capital mínimo en UDI
  requirement: El capital mínimo es el equivalente a 500,000 UDI si la ITF está en
    el supuesto del art. 6 de las DCG (una sola operación en moneda nacional, con
    el matiz del propio artículo para IFPE) y de 700,000 UDI en los supuestos del
    art. 7. El documento debe citar uno de esos montos y no un capital inferior presentado
    como suficiente.
  check_hint: Chequeo determinístico sobre el documento clasificado. No se completa
    la laguna.
  fix_suggestion: Actualice «Capital mínimo en UDI» con fecha de aprobación, versión
    vigente y la evidencia que pide la fuente (DCG ITF arts. 6 y 7, DOF nota 5537450
    (10-sep-2018)). No deje placeholders.
  entity_types: &id001
  - IFPE
  - IFC
  documents:
  - politica_capital
  source_url: https://dof.gob.mx/nota_detalle_popup.php?codigo=5537450
  source_name: DCG ITF arts. 6 y 7, DOF nota 5537450 (10-sep-2018)
  effective_date: '2018-09-10'
  last_verified: '2026-11-06'
  severity: critical
  unverified: false
  min_strictness: standard
  binding: true
  owner_role: Dirección de cumplimiento regulatorio
  remediation_days: 15
  evidence_expected:
  - Documento politica_capital aprobado y vigente.
  procedure:
  - Confirmar que la entidad y el perfil activan «Capital mínimo en UDI».
  - Localizar el documento en el inventario y su fecha de aprobación.
  - Contrastar el texto con la fuente citada, sin inferir artículos no leídos.
  - Dejar condición, causa, efecto, recomendación, responsable y plazo.
  matcher:
    require_document: true
    checks:
    - type: contains_any
      label: el monto en UDI
      any:
      - 500,000 UDI
      - 500000 UDI
      - 700,000 UDI
      - 700000 UDI
    - type: forbidden_phrases
      label: un capital inferior presentado como mínimo
      any:
      - 100,000 UDI
      - 100000 UDI
      - por definir
- id: regulatorio-capital-suscrito-pagado
  domain: regulatorio
  area: regulatorio
  title: Capital suscrito y pagado al cierre del año
  requirement: El art. 8 de las DCG exige que el capital mínimo esté suscrito y pagado
    a más tardar el último día hábil del año, con la UDI del 31 de diciembre del año
