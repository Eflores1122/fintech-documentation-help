  id: lritf-continuidad-controles
  domain: lritf
  title: "Controles internos, continuidad operativa y seguridad"
  requirement: "Las ITF se sujetan a disposiciones de carácter general en controles internos, administración de riesgos, segregación de funciones, continuidad operativa y seguridad de la información. Para IFPE, las disposiciones son conjuntas de CNBV y Banxico."
  check_hint: Deben existir el plan de continuidad y el manual de control interno.
  fix_suggestion: "Documente el plan de continuidad operativa y el manual de control interno, con la aprobación del órgano de administración."
