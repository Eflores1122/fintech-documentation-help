- last_verified: '2026-11-05'
  id: lritf-no-garantia-gobierno
  domain: lritf
  title: "Divulgación: el Gobierno Federal no garantiza los recursos de los clientes"
  requirement: "Las ITF deben señalar expresamente que el Gobierno Federal y las entidades paraestatales no pueden responsabilizarse ni garantizar los recursos de los clientes, en páginas, aplicaciones, publicidad y contratos."
  check_hint: Buscar una leyenda equivalente a que los recursos no están garantizados por autoridad alguna.
  fix_suggestion: "Inserte en el contrato, la carátula, la publicidad y los términos la leyenda de que el Gobierno Federal y las entidades paraestatales no garantizan ni se responsabilizan de los recursos de los clientes."
  entity_types:
  - IFPE
  - IFC
  documents:
  - contrato_adhesion
  - caratula
  - publicidad
  - terminos_plataforma
  - website
  source_url: "https://www.diputados.gob.mx/LeyesBiblio/pdf/LRITF.pdf"
  source_name: LRITF art. 11
  effective_date: '2018-03-09'
  severity: critical
  matcher:
    require_document: true
    checks:
    - type: contains_any
      label: la leyenda de no garantía del Gobierno Federal
      any:
      - gobierno federal no
      - no se encuentran garantizados
      - ni las entidades paraestatales
      - no garantiza los recursos
      - no podrán responsabilizarse
      - no podran responsabilizarse
      - no están garantizados por el gobierno
      - no estan garantizados por el gobierno
      - no garantiza ni se responsabiliza
- last_verified: '2026-11-05'
  id: lritf-politicas-segregacion
  domain: lritf
  title: Políticas de separación o segregación de cuentas de clientes
  requirement: "La operación exige políticas de separación de cuentas: los recursos de clientes se segregan de los propios y se depositan conforme al art. 46."
  check_hint: El documento de segregación debe describir cuentas distintas y el depósito de los recursos de clientes.
  fix_suggestion: "Documente la segregación: cuentas distintas de las propias, depósito de los recursos de clientes y el momento en que se realiza."
  entity_types:
  - IFPE
  - IFC
  documents:
  - politica_segregacion
  - manual_operaciones
  - politica_tesoreria
  source_url: "https://www.diputados.gob.mx/LeyesBiblio/pdf/LRITF.pdf"
  source_name: "LRITF arts. 39-IV, 46"
  effective_date: '2018-03-09'
  severity: critical
  matcher:
    require_document: true
    checks:
    - type: contains_all_groups
      groups:
      - name: Segregación o separación de cuentas
        any:
        - segregación
        - segregacion
        - separación de cuentas
        - separacion de cuentas
      - name: Recursos de clientes
        any:
        - clientes
      - name: Cuentas
        any:
        - cuenta
- last_verified: '2026-11-05'
  id: lritf-divulgacion-riesgos-comisiones
  domain: lritf
  title: "Políticas de divulgación de riesgos, responsabilidades y comisiones"
  requirement: "Políticas en lenguaje sencillo sobre riesgos, responsabilidades, conceptos y montos de comisiones, y advertencias en la interfaz."
  check_hint: Debe existir divulgación de riesgos y un listado de comisiones.
  fix_suggestion: "Publique, en lenguaje sencillo, los riesgos del producto y el concepto, monto y periodicidad de cada comisión antes de que el cliente opere."
