  id: lritf-conservacion-10-anos
  domain: lritf
  title: Conservación de comprobantes de operaciones por al menos 10 años
  requirement: "Conservar los comprobantes originales de las operaciones por un plazo mínimo de diez años, en impreso o en medios electrónicos conforme a la NOM de digitalización."
  check_hint: La política de retención documental debe decir al menos 10 años para comprobantes de operaciones.
  fix_suggestion: Fije en la política de archivo un plazo mínimo de diez años para los comprobantes de las operaciones.
  entity_types:
  - IFPE
  - IFC
  documents:
  - politica_retencion_documental
  - manual_archivo
  source_url: "https://www.diputados.gob.mx/LeyesBiblio/pdf/LRITF.pdf"
  source_name: LRITF art. 48
  effective_date: '2018-03-09'
  severity: medium
  matcher:
    require_document: true
    checks:
    - type: contains_any
      label: un plazo de conservación de al menos diez años
      any:
      - diez años
      - 10 años
      - diez (10) años
