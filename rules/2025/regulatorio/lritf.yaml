  id: lritf-av-divulgacion-riesgos
  domain: lritf
  title: Divulgación de riesgos de activos virtuales
  requirement: "Quien opere con activos virtuales debe divulgar que no son moneda de curso legal ni están respaldados por el Gobierno o Banxico, y advertir irreversibilidad, volatilidad y riesgos tecnológicos, cibernéticos y de fraude."
  check_hint: Solo aplica si la entidad opera activos virtuales. La carátula o la plataforma deben incluir las leyendas del art. 34.
  fix_suggestion: "Si opera activos virtuales, agregue en carátula y plataforma que no son moneda de curso legal ni están respaldados por el Gobierno Federal o Banxico, y advierta volatilidad e irreversibilidad."
  entity_types:
  - IFPE
  - IFC
  documents:
  - caratula
  - terminos_plataforma
  - publicidad
  - contrato_adhesion
  source_url: "https://www.diputados.gob.mx/LeyesBiblio/pdf/LRITF.pdf"
  source_name: LRITF art. 34
  effective_date: '2018-03-09'
  severity: high
  applies_if: operates_virtual_assets
  matcher:
    require_document: true
    checks:
    - type: contains_any
      label: las leyendas de activos virtuales
      any:
      - no es moneda de curso legal
      - no son moneda de curso legal
      - volatilidad
      - no respaldada por el banco de méxico
      - no respaldados por el banco de mexico
      - no respaldados por el banco de méxico
