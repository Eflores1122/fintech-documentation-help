  domain: lritf
  title: Políticas de control de riesgos operativos y seguridad de la información
  requirement: "Medidas y políticas de riesgos operativos y seguridad de la información, incluida la confidencialidad, con soporte tecnológico y estándares de confidencialidad, disponibilidad e integridad."
  check_hint: Deben existir el manual de seguridad de la información y la política de riesgos operativos.
