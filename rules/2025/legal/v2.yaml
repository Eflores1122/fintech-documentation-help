rules:
- id: legal-oficio-autorizacion
  domain: legal
  area: legal
  title: Oficio de autorización para operar como ITF
  requirement: La ITF debe conservar la autorización de la CNBV para organizarse y
    operar. El número de artículo de la LRITF no se fija aquí.
  check_hint: Chequeo determinístico sobre el documento clasificado. No se completa
    la laguna.
  fix_suggestion: Actualice «Oficio de autorización para operar como ITF» con fecha
    de aprobación, versión vigente y la evidencia que pide la fuente (LRITF (autorización
    de ITF; artículo no releído)). No deje placeholders.
  entity_types: &id001
  - IFPE
  - IFC
  documents:
  - oficio_autorizacion
  source_url: https://www.diputados.gob.mx/LeyesBiblio/pdf/LRITF.pdf
  source_name: LRITF (autorización de ITF; artículo no releído)
  effective_date: '2018-03-09'
  last_verified: '2026-11-06'
  severity: critical
  unverified: true
  min_strictness: standard
  binding: true
  owner_role: Dirección jurídica
  remediation_days: 15
  evidence_expected:
  - Documento oficio_autorizacion aprobado y vigente.
  procedure:
  - Confirmar que la entidad y el perfil activan «Oficio de autorización para operar
    como ITF».
  - Localizar el documento en el inventario y su fecha de aprobación.
  - Contrastar el texto con la fuente citada, sin inferir artículos no leídos.
  - Dejar condición, causa, efecto, recomendación, responsable y plazo.
  matcher:
    require_document: true
    checks:
    - type: contains_any
      label: la autorización de la CNBV
      any:
      - autorización de la CNBV
      - autorizacion de la CNBV
  unverified_detail: No se leyó el artículo completo en la pasada del 2026-11-06;
    no se afirma el número como verificado.
