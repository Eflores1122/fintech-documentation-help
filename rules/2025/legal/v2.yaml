- id: legal-terceros-autorizacion-ifc
  domain: legal
  area: legal
  title: Autorización de la CNBV para ciertos servicios con terceros (IFC)
  requirement: El art. 85 de la resolución que modifica las DCG de ITF abre diciendo
    que la IFC solamente requerirá autorización de la CNBV para contratar terceros
    cuyos servicios tengan las características que el propio artículo lista. El listado
    completo de esas características no se transcribió en esta ficha.
  check_hint: Chequeo determinístico sobre el documento clasificado. No se completa
    la laguna.
  fix_suggestion: Actualice «Autorización de la CNBV para ciertos servicios con terceros
    (IFC)» con fecha de aprobación, versión vigente y la evidencia que pide la fuente
    (DCG ITF, art. 85 (resolución firmada el 14-mar-2019, nota DOF 5555030)). No deje
    placeholders.
