rules:
- id: condusef-quejas-expediente
  domain: condusef
  area: condusef
  title: Expediente y plazos de quejas
  requirement: La UNE debe tener un procedimiento de quejas. Los días exactos de respuesta
    de las disposiciones de transparencia de ITF no se releyeron; no se inventa un
    plazo.
  check_hint: Chequeo determinístico sobre el documento clasificado. No se completa
    la laguna.
  fix_suggestion: Actualice «Expediente y plazos de quejas» con fecha de aprobación,
    versión vigente y la evidencia que pide la fuente (Disposiciones de transparencia
    ITF (plazos de queja no releídos)). No deje placeholders.
  entity_types: &id001
  - IFPE
  - IFC
  documents:
  - procedimiento_quejas
  source_url: https://sidof.segob.gob.mx/notas/docFuente/5565233
  source_name: Disposiciones de transparencia ITF (plazos de queja no releídos)
  effective_date: '2019-07-09'
  last_verified: '2026-11-06'
  severity: high
  unverified: true
  min_strictness: standard
  binding: true
  owner_role: Titular de la UNE
  remediation_days: 30
  evidence_expected:
  - Documento procedimiento_quejas aprobado y vigente.
  procedure:
  - Confirmar que la entidad y el perfil activan «Expediente y plazos de quejas».
  - Localizar el documento en el inventario y su fecha de aprobación.
  - Contrastar el texto con la fuente citada, sin inferir artículos no leídos.
  - Dejar condición, causa, efecto, recomendación, responsable y plazo.
  matcher:
    require_document: true
    checks:
    - type: contains_any
      label: la queja
      any:
      - queja
      - UNE
  unverified_detail: 'No se fijó un número de días: el texto de plazos no se releyó.'
