services:
  fdh:
    build: .
    ports:
      - "8000:8000"
    environment:
      FDH_LLM_PROVIDER: ${FDH_LLM_PROVIDER:-}
      FDH_LLM_BASE_URL: ${FDH_LLM_BASE_URL:-http://ollama:11434/v1}
      FDH_LLM_MODEL: ${FDH_LLM_MODEL:-qwen2.5:7b}

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434:11434"
